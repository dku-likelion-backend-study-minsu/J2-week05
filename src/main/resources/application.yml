server:
  port: 8090
spring:
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13308/j2_week05?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:j2_week05}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # The lecture passes managed entities from controllers to services.
    open-in-view: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
custom:
  site:
    name: "My Site"
  # Only a non-sensitive lecture placeholder; never use database credentials here.
  secret:
    key: "local-study-placeholder"
